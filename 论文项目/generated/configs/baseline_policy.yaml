environment:
  epsilon: 1.5
  interpolation_period: 0.001
  lookahead_obs_enabled: false
  lookahead_points: 0
  max_steps: 60000
experiment:
  baseline_type: nnc
  category: paper_suite
  enable_kcm: false
  mode: baseline_nnc
  model_path: null
  name: baseline_policy
  paper_description: 以无前瞻观测、无前瞻动作且无KCM约束的普通 NNC 强化学习口径重新训练并评测
  paper_label: NNC 基线
  paper_variant: baseline_policy
  seed: 42
kinematic_constraints:
  MAX_ACC: 2000.0
  MAX_ANG_ACC: 31.41592653589793
  MAX_ANG_JERK: 1000.0
  MAX_ANG_VEL: 6.283185307179586
  MAX_JERK: 62500.0
  MAX_VEL: 100.0
path:
  closed: true
  name: square
  num_points: 1200
  scale: 100.0
  square:
    start_offset_ratio: 0.2
  type: square
ppo:
  actor_lr: 0.0001
  batch_size: null
  critic_lr: 0.00012
  ent_coef: 0.01
  epochs: 10
  eps: 0.1
  gamma: 0.99
  hidden_dim: 256
  lmbda: 0.95
reward_weights:
  cornerness:
    enabled: false
    keep_legacy_smooth: true
  corridor:
    barrier_scale_ratio: 0.05
    barrier_weight: 2.0
    center_power: 1.0
    center_weight: 1.2
    dir_pref_beta: 2.0
    dir_pref_weight: 1.0
    dist_enter: 6.0
    dist_exit: 8.0
    enabled: false
    exit_center_ramp_steps: 60
    heading_weight: 2.0
    margin_ratio: 0.1
    outside_penalty_weight: 20.0
    safe_margin_ratio: 0.2
    theta_enter_deg: 12.0
    theta_exit_deg: 6.0
  lookahead_control:
    enabled: false
    policy_action: false
  p4:
    d_scale: null
    debug: false
    exit_boost_enabled: true
    exit_progress_mult: 1.35
    exit_speed_target_min: 0.95
    exit_window_sec: 0.25
    p7_2_k: 0.01
    speed_cap_enabled: false
    speed_cap_eps: 1e-12
    speed_cap_k: 4
    speed_cap_preview_points: 8
    speed_cap_s_max: 30.0
    speed_cap_s_min: 1.0
    speed_cap_use_wddot: true
    speed_cap_use_wdot: true
    speed_weight: 6.0
    stall_enabled: true
    stall_penalty: -8.0
    stall_progress_eps: 1e-4
    stall_steps: 300
    stall_v_eps: 0.05
    theta_max_deg: 90.0
    time_penalty: -0.01
    v_max: 1.0
    v_min: 0.35
  p6_1:
    a_ref_max_ratio: 0.5
    du_enabled: true
    du_mode: l1
    j_ref_enabled: true
    j_ref_max_ratio: 0.5
    v_target_mode: accel
    v_target_smoother_enabled: false
    v_target_tau: 0.1
    w_du: 0.01
  p7_3:
    kappa_dkappa_limit: null
    kappa_smoothing_beta: 0.25
    kappa_smoothing_enabled: false
    stall_cap_low: 0.25
    trace_ring_size: 200
  p8:
    ang_cap_min_ratio: 0.1
    corner_exit_e_release_ratio: 0.5
    corner_exit_hold_steps: 3
    corner_exit_psi_release_deg: 30.0
    corner_mode_ignore_geom_cap: false
    corner_off_dist_scale: 4.0
    corner_on_dist_scale: 2.0
    recovery_e_release_ratio: 0.5
    recovery_e_warn_ratio: 0.75
    recovery_vcap: 0.1
    straight_mode_ignore_geom_cap: false
    use_corner_exit_hysteresis: true
    use_recovery_cap: false
    use_vcap_rate_limit: true
    vcap_rate_down: 0.05
    vcap_rate_up: 0.1
  w_e: 5.0
  w_s: 20.0
  w_smooth: 0.05
  w_t: 1.0
  w_tau: 2.0
seed: 42
training:
  checkpoint_interval_steps: 2048
  enable_best_trajectory_snapshot: true
  enable_final_visualization: false
  enable_latest_trajectory: false
  log_interval: 50
  num_episodes: 900
  path_curriculum:
    enabled: true
    episodes_per_path: 4
    mode: round_robin
    paths:
    - closed: true
      name: square
      num_points: 1200
      scale: 100.0
      square:
        start_offset_ratio: 0.2
      type: square
    - circle:
        closed: true
      name: circle
      num_points: 960
      scale: 100.0
      type: circle
    - butterfly:
        closed: true
        cross_ratio: 0.1
        long_ratio: 1.45
        style: academic
        wing_ratio: 1.0
      name: butterfly
      num_points: 720
      scale: 28.0
      type: butterfly
    seed: 42
  save_interval: 100
  smoothing_factor: 0.9
  step_log_interval_steps: 10
  time_budget_seconds: 7200.0
  traj_write_interval_steps: 0
  use_obs_normalizer: false
